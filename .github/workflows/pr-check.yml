name: PR check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    name: PR check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx lerna run build

      - name: Check for stale generated files
        run: test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }

      - name: Test map-template
        working-directory: packages/map-template
        run: npx jest

      - name: Test components
        working-directory: packages/components
        run: npx stencil test --spec

      - name: Lint map-template
        working-directory: packages/map-template
        run: npx eslint . --ext .js,.jsx

      - name: Lint components
        working-directory: packages/components
        run: npx eslint src --ext .ts,.tsx
